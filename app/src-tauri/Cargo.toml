[package]
name = "plan-up"
version = "0.0.0"
description = "plan-up — single-user, local-first task & sprint planner"
edition = "2021"

[lib]
name = "plan_up_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.5.4"
# gzip for the versions/ backup tier (auto-backup.md, "Disk footprint")
flate2 = "1"

# Desktop-only plugins: the iOS build (ios-app.md) has no updater, no relaunch and
# no window to remember.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# remembers window size/position across launches (desktop-native-feel.md)
tauri-plugin-window-state = "~2.4" # 2.5 needs tauri 2.12; keep crate + @tauri-apps/api on the same minor

[profile.release]
codegen-units = 1
lto = true
strip = true
